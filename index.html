<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Buddy</title>
    
    <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.2.4/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2025.2.4/core.js">
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('lavender.jpg');
            background-size: cover;
        }
        .calculator {
            max-width: 400px;
            margin: 0 auto;
            margin-top: 120px;
            padding: 20px;
            border: 1px solid #40296d;
            border-radius: 10px;
            background-color: #b0a8bb;
            text-align: center;
        }
        button:hover { 
            background: #b7a0ca; 
            transform: translateY(-2px);
        }
        h1 {
            margin-bottom: 7px;
            color:#2e1c37
        }
        p {
            color:#2e1c37
        }

    </style>
</head>
<body>

    <div class="calculator">
    <h1> ✎ᝰ Study Buddy ✎ᝰ </h1>
    <p>Your little arithmetic helper! ♥︎ </p>

    <label for="num1">First Number:</label>
    <input type="number" id="num1">

    <br><br>

    <label for="num2">Second Number:</label>
    <input type="number" id="num2">

    <br><br>

       <label>Select Operation:</label>

    <select id="operation">
        <option value="+">Addition (+)</option>
        <option value="-">Subtraction (-)</option>
        <option value="x">Multiplication (*)</option>
        <option value="/">Division (/)</option>
    </select>

    <br><br>

    <button py-click="calculate">Calculate ✦</button>

    <br><br>

    <div id="result">

    </div>
    <div id="result"> Your answer will appear here ♥︎
    </div> 
    <p class="footer"> ✿ study hard!! ✿ </p> 
    </div>

    <script type="py" src="./main.py"></script>

    
</body>
</html>
